<div class="bg-white rounded-lg shadow-xl w-full max-h-screen max-h-screen overflow-y-auto">
    <div class="p-6">
        <form [formGroup]="form">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div *ngIf="loading" class="p-4 space-y-4">
                    <div class="animate-pulse space-y-2">
                        <div class="h-4 bg-gray-300 rounded w-3/4"></div>
                        <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                    </div>
                </div>
                <div *ngIf="!loading">
                    <label for="productName" class="block label font-medium text-gray-700 mb-2">Product Name</label>
                    <input formControlName="productName" type="text" id="productName" name="productName"
                        placeholder="Product Name" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 
                     focus:border-transparent transition duration-200">
                </div>
                <div *ngIf="loading" class="p-4 space-y-4">
                    <div class="animate-pulse space-y-2">
                        <div class="h-4 bg-gray-300 rounded w-3/4"></div>
                        <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                    </div>
                </div>
                <div *ngIf="!loading">
                    <label for="currentStock" class="block label font-medium text-gray-700 mb-2">Available Stock</label>
                    <input formControlName="currentStock" type="text" id="currentStock" name="currentStock"
                        placeholder="Product Name" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 
                     focus:border-transparent transition duration-200">
                </div>
                <div>
                    <label for="quantity" class="block label font-medium text-gray-700 mb-2">Increase Stock By</label>
                    <input formControlName="quantity" type="text" id="quantity" name="quantity"
                        placeholder="Product Name" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 
                     focus:border-transparent transition duration-200">
                </div>
            </div>
        </form>
    </div>
</div>
