<router-outlet>
    <div id="customersDetailPage">
        <div class="max-w-7xl mx-auto px-4 py-4 md:py-8">
            <div
                class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 space-y-4 sm:space-y-0">
                <h2 class="text-2xl md:text-3xl font-bold text-white">Product Details</h2>
                <button (click)="goBack()"
                    class="w-full sm:w-auto bg-green-600 text-white px-4 py-2 md:px-6 md:py-3 rounded-lg hover:bg-green-700 transition duration-200 font-medium text-sm md:text-base flex items-center">

                    <!-- Back arrow icon SVG -->
                    <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M15 18l-6-6 6-6"></path>
                    </svg>

                    Back to Product
                </button>

            </div>
            <div class="flex flex-col md:flex-row gap-4">
                <div class="bg-white rounded-lg shadow-md overflow-hidden w-full md:w-1/4 flex items-center justify-center">
                    <div *ngIf="logoLoading" class="p-4 space-y-4">
                        @for (i of [1,2]; track i) {
                        <div class="animate-pulse space-y-2">
                            <div class="h-4 bg-gray-300 rounded w-3/4"></div>
                            <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                        </div>
                        }
                    </div>
                    <div *ngIf="!logoLoading" class="w-[70%] h-[70%] flex items-center justify-center">
                        <img data-bs-toggle="tooltip" [src]="productImageUrl" class="w-full h-full object-contain"
                            (error)="productImageUrl='assets/images/no_image_found.png'" alt="Profile Image" />
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow-md overflow-hidden w-full md:w-3/4 p-4">
                    <div class="flex flex-col md:flex-row flex-wrap">
                        <!-- Column 1: Label/Value Pair -->
                        <div class="flex flex-row md:flex-col w-full md:w-1/3 mb-4 md:mb-0">
                            <div class="w-1/2 md:w-full block label font-medium text-gray-700 mb-2">Product
                                Name</div>
                            <div *ngIf="productDetailsLoading" class="p-4 space-y-4">
                                @for (i of [1]; track i) {
                                <div class="animate-pulse space-y-2">
                                    <div class="h-4 bg-gray-300 rounded w-3/4"></div>
                                </div>
                                }
                            </div>
                            <div *ngIf="!productDetailsLoading" class="w-1/2 md:w-full">
                                <input type="text" id="customerName" name="customerName" disabled
                                    class="w-[90%] px-4 py-3 border border-gray-300 rounded-lg 
                                bg-gradient-to-r font-semibold from-blue-700 to-purple-900 text-transparent bg-clip-text" 
                                [(ngModel)]="productDetails.productName" />
                            </div>
                        </div>
                                                <div class="flex flex-row md:flex-col w-full md:w-1/3 mb-4 md:mb-0">
                            <div class="w-1/2 md:w-full block label font-medium text-gray-700 mb-2">Unit Cost (₹)</div>
                            <div *ngIf="productDetailsLoading" class="p-4 space-y-4">
                                @for (i of [1]; track i) {
                                <div class="animate-pulse space-y-2">
                                    <div class="h-4 bg-gray-300 rounded w-3/4"></div>
                                </div>
                                }
                            </div>
                            <div *ngIf="!productDetailsLoading" class="w-1/2 md:w-full">
                                <input type="text" id="secnContactNo" name="secnContactNo" disabled
                                    class="w-[90%] px-4 py-3 border border-gray-300 rounded-lg 
                                bg-gradient-to-r font-semibold from-blue-700 to-purple-900 text-transparent bg-clip-text" 
                                [(ngModel)]="productDetails.unitCost" />
                            </div>
                        </div>
                        <div class="flex flex-row md:flex-col w-full md:w-1/3 mb-4 md:mb-0">
                            <div class="w-1/2 md:w-full block label font-medium text-gray-700 mb-2">Stock</div>
                            <div *ngIf="productDetailsLoading" class="p-4 space-y-4">
                                @for (i of [1]; track i) {
                                <div class="animate-pulse space-y-2">
                                    <div class="h-4 bg-gray-300 rounded w-3/4"></div>
                                </div>
                                }
                            </div>
                            <div *ngIf="!productDetailsLoading" class="w-1/2 md:w-full">
                                <input type="text" id="customerEmail" name="customerEmail" disabled
                                    class="w-[90%] px-4 py-3 border border-gray-300 rounded-lg 
                                bg-gradient-to-r font-semibold from-blue-700 to-purple-900 text-transparent bg-clip-text" 
                                [(ngModel)]="productDetails.stockDisplay" />
                            </div>
                        </div>
                        <!-- <div class="flex flex-row md:flex-col w-full md:w-1/3 mb-4 md:mb-0">
                            <div class="w-1/2 md:w-full block label font-medium text-gray-700 mb-2">Unit Type.</div>
                            <div *ngIf="productDetailsLoading" class="p-4 space-y-4">
                                @for (i of [1]; track i) {
                                <div class="animate-pulse space-y-2">
                                    <div class="h-4 bg-gray-300 rounded w-3/4"></div>
                                </div>
                                }
                            </div>
                            <div *ngIf="!productDetailsLoading" class="w-1/2 md:w-full">
                               <input type="text" id="contactNo" name="contactNo" disabled
                                    class="w-[90%] px-4 py-3 border border-gray-300 rounded-lg 
                                bg-gradient-to-r font-semibold from-blue-700 to-purple-900 text-transparent bg-clip-text" 
                                [(ngModel)]="productDetails.unitNameDetail" />
                            </div>
                        </div> -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</router-outlet>
