<div class="bg-white rounded-lg shadow-xl w-full max-h-screen max-h-screen overflow-y-auto">
    <div class="p-6">
        <form id="customerForm">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="customerName" class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                    <input type="text" id="customerName" name="name" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label for="customerEmail" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input type="email" id="customerEmail" name="email" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label for="customerPhone" class="block text-sm font-medium text-gray-700 mb-2">Phone</label>
                    <input type="tel" id="customerPhone" name="phone"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label for="customerCompany" class="block text-sm font-medium text-gray-700 mb-2">Company</label>
                    <input type="text" id="customerCompany" name="company"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label for="customerGstin" class="block text-sm font-medium text-gray-700 mb-2">GSTIN</label>
                    <input type="text" id="customerGstin" name="gstin"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label for="customerLogo" class="block text-sm font-medium text-gray-700 mb-2">Company Logo</label>
                    <input type="file" id="customerLogo" name="logo" accept="image/*"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div class="md:col-span-2">
                    <label for="customerAddress" class="block text-sm font-medium text-gray-700 mb-2">Address</label>
                    <textarea id="customerAddress" name="address" rows="3"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>
            </div>
        </form>

        <div id="customerInvoices" class="mt-8 hidden">
            <h4 class="text-lg font-semibold text-gray-800 mb-4">Customer Invoices</h4>
            <div class="bg-gray-50 rounded-lg overflow-hidden">
                <table class="w-full">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">Invoice #</th>
                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">Date</th>
                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">Amount</th>
                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">Status</th>
                        </tr>
                    </thead>
                    <tbody id="customerInvoicesBody">
                        <!-- Customer invoices will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
