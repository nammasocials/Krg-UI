<div class="bg-white rounded-lg shadow-xl w-full max-h-screen max-h-screen overflow-y-auto">
    <div class="p-6">
        <form [formGroup]="form">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="customerName" class="block label font-medium text-gray-700 mb-2">Customer Name</label>
                    <input formControlName="customerName" type="text" id="customerName" name="customerName" required
                        [ngClass]="{'border-red-500 focus:ring-red-500': customerName?.invalid && (customerName?.dirty 
                     || customerName?.touched),'border-gray-300 focus:ring-blue-500': !(customerName?.invalid 
                     && (customerName?.dirty || customerName?.touched))}" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 
                     focus:border-transparent transition duration-200">
                    <div *ngIf="customerName?.touched && customerName?.invalid" class="error-messages">
                        Customer Name should be 5-50 characters long and contain only letters and dot.
                    </div>
                </div>
                <div>
                    <label for="customerEmail" class="block label font-medium text-gray-700 mb-2">Email</label>
                    <input formControlName="customerEmail" type="text" id="customerEmail" name="customerEmail" required
                        [ngClass]="{'border-red-500 focus:ring-red-500': customerEmail?.invalid && (customerEmail?.dirty 
                     || customerEmail?.touched),'border-gray-300 focus:ring-blue-500': !(customerEmail?.invalid 
                     && (customerEmail?.dirty || customerEmail?.touched))}" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 
                     focus:border-transparent transition duration-200">
                    <div *ngIf="customerEmail?.touched && customerEmail?.invalid" class="error-messages">
                        Please enter valid email.
                    </div>
                </div>
                <div>
                    <label for="contactNo" class="block label font-medium text-gray-700 mb-2">Phone</label>
                    <input formControlName="contactNo" type="text" id="contactNo" name="contactNo" required [ngClass]="{'border-red-500 focus:ring-red-500': contactNo?.invalid && (contactNo?.dirty 
                     || contactNo?.touched),'border-gray-300 focus:ring-blue-500': !(contactNo?.invalid 
                     && (contactNo?.dirty || contactNo?.touched))}" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 
                     focus:border-transparent transition duration-200">
                    <div *ngIf="contactNo?.touched && contactNo?.invalid" class="error-messages">
                        Please enter valid Contact No.
                    </div>
                </div>
                <div>
                    <label for="secnContactNo" class="block label font-medium text-gray-700 mb-2">Alternate Contact
                        No.</label>
                    <input formControlName="secnContactNo" type="text" id="secnContactNo" name="secnContactNo"
                        [ngClass]="{'border-red-500 focus:ring-red-500': contactNo?.invalid && (contactNo?.dirty),
                        'border-gray-300 focus:ring-blue-500': !(secnContactNo?.invalid 
                     && (secnContactNo?.dirty))}" class="w-full px-4 py-3 border border-gray-300 
                     rounded-lg focus:ring-2 focus:ring-blue-500 
                     focus:border-transparent transition duration-200">
                    <div *ngIf="secnContactNo?.invalid" class="error-messages">
                        Please enter valid Contact No.
                    </div>
                </div>
                <div>
                    <label for="gst" class="block label font-medium text-gray-700 mb-2">GSTIN</label>
                    <input formControlName="gst" type="text" id="gst" name="gst" required [ngClass]="{'border-red-500 focus:ring-red-500': gst?.invalid && (gst?.dirty 
                     || gst?.touched),'border-gray-300 focus:ring-blue-500': !(gst?.invalid 
                     && (gst?.dirty || gst?.touched))}" class="w-full px-4 py-3 border border-gray-300 
                     rounded-lg focus:ring-2 focus:ring-blue-500 
                     focus:border-transparent transition duration-200">
                    <div *ngIf="gst?.touched && gst?.invalid" class="error-messages">
                        Please enter valid GSTIN.
                    </div>
                </div>
                <div>
                    <label for="companyLogo" class="block label font-medium text-gray-700 mb-2">Company Logo</label>
                    <input formControlName="companyLogo" type="file" id="companyLogo" name="companyLogo" required
                        [ngClass]="{'border-red-500 focus:ring-red-500': companyLogo?.invalid && (companyLogo?.dirty),'border-gray-300 focus:ring-blue-500': !(companyLogo?.invalid 
                     && (companyLogo?.dirty))}" class="w-full px-4 py-3 border border-gray-300 rounded-lg 
                     focus:ring-2 focus:ring-blue-500 focus:border-transparent
                     focus:border-transparent transition duration-200" accept="image/*">
                    <div *ngIf="companyLogo?.invalid"
                        class="error-messages text-red-600 text-sm mt-1">
                        <div *ngIf="companyLogo?.errors?.['invalidFileType']">Only image files are allowed (jpg, png,
                            webp...)</div>
                        <div *ngIf="companyLogo?.errors?.['fileTooLarge']">File size must be under 5 MB</div>
                    </div>
                </div>
                <div class="md:col-span-2">
                    <label for="customerAddress" class="block text-sm font-medium text-gray-700 mb-2">Address</label>
                    <textarea id="customerAddress" name="address" rows="3"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>
            </div>
        </form>

</div>
