<div class="bg-white rounded-lg shadow-xl w-full max-h-screen max-h-screen overflow-y-auto">
    <div class="p-6">
        <form [formGroup]="form">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="customerName" class="block label font-medium text-gray-700 mb-2">Customer Name</label>
                    <input formControlName="customerName" type="text" id="customerName" name="customerName"
                     required [ngClass]="{'border-red-500 focus:ring-red-500': customerName?.invalid && (customerName?.dirty 
                     || customerName?.touched),'border-gray-300 focus:ring-blue-500': !(customerName?.invalid 
                     && (customerName?.dirty || customerName?.touched))}" 
                     class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 
                     focus:border-transparent transition duration-200">
                    <div *ngIf="customerName?.touched && customerName?.invalid" class="error-messages">
                        Customer Name should be 5-50 characters long and contain only letters and dot.
                    </div>
                </div>
                <div>
                    <label for="customerEmail" class="block label font-medium text-gray-700 mb-2">Email</label>
                    <input formControlName="customerEmail" type="text" id="customerEmail" name="customerEmail"
                     required [ngClass]="{'border-red-500 focus:ring-red-500': customerEmail?.invalid && (customerEmail?.dirty 
                     || customerEmail?.touched),'border-gray-300 focus:ring-blue-500': !(customerEmail?.invalid 
                     && (customerEmail?.dirty || customerEmail?.touched))}" 
                     class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 
                     focus:border-transparent transition duration-200">
                    <div *ngIf="customerEmail?.touched && customerEmail?.invalid" class="error-messages">
                        Please enter valid email.
                    </div>
                </div>
                <div>
                    <label for="customerPhone" class="block text-sm font-medium text-gray-700 mb-2">Phone</label>
                    <input type="tel" id="customerPhone" name="phone"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label for="customerGstin" class="block text-sm font-medium text-gray-700 mb-2">GSTIN</label>
                    <input type="text" id="customerGstin" name="gstin"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label for="customerLogo" class="block text-sm font-medium text-gray-700 mb-2">Company Logo</label>
                    <input type="file" id="customerLogo" name="logo" accept="image/*"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div class="md:col-span-2">
                    <label for="customerAddress" class="block text-sm font-medium text-gray-700 mb-2">Address</label>
                    <textarea id="customerAddress" name="address" rows="3"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>
            </div>
        </form>
