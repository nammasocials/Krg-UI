<router-outlet>
    <div id="customersPage">
        <div class="max-w-7xl mx-auto px-4 py-4 md:py-8">
            <div
                class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 space-y-4 sm:space-y-0">
                <h2 class="text-2xl md:text-3xl font-bold text-white">Customers</h2>
                <button (click)="AddCustomerPopup()"
                    class="w-full sm:w-auto bg-green-600 text-white px-4 py-2 md:px-6 md:py-3 rounded-lg hover:bg-green-700 transition duration-200 font-medium text-sm md:text-base">
                    Add Customer
                </button>
            </div>

            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div *ngIf="loading" class="p-4 space-y-4">
                    @for (i of [1,2,3,4]; track i) {
                    <div class="animate-pulse space-y-2">
                        <div class="h-4 bg-gray-300 rounded w-3/4"></div>
                        <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                    </div>
                    }
                </div>
                <app-custom-table *ngIf="!loading" 
                [data]="customerData" [headerData]="headerData" [options]="options"
                (OptionsClicked)="OpenOptions($event)"> 
                </app-custom-table>
            </div>
        </div>
    </div>
</router-outlet>
