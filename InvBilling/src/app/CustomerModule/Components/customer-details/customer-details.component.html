<router-outlet>
    <div id="customersDetailPage">
        <div class="max-w-7xl mx-auto px-4 py-4 md:py-8">
            <div
                class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 space-y-4 sm:space-y-0">
                <h2 class="text-2xl md:text-3xl font-bold text-white">Customer Details</h2>
                <button (click)="goBack()"
                    class="w-full sm:w-auto bg-green-600 text-white px-4 py-2 md:px-6 md:py-3 rounded-lg hover:bg-green-700 transition duration-200 font-medium text-sm md:text-base flex items-center">

                    <!-- Back arrow icon SVG -->
                    <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M15 18l-6-6 6-6"></path>
                    </svg>

                    Back to Customer
                </button>

            </div>
            <div class="flex flex-col md:flex-row gap-4">
                <div class="bg-white rounded-lg shadow-md overflow-hidden w-full md:w-1/4">
                    <div *ngIf="loading" class="p-4 space-y-4">
                        @for (i of [1,2,3,4]; track i) {
                        <div class="animate-pulse space-y-2">
                            <div class="h-4 bg-gray-300 rounded w-3/4"></div>
                            <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                        </div>
                        }
                    </div>
                    <div *ngIf="!loading">
                        <!-- <img data-bs-toggle="tooltip" [src]="empPersonalDetails.photolocation"
                            (error)="empPersonalDetails.photolocation='assets/images/default.png'" alt="Profile Image"
                            class="imagemax" /> -->
                        <img [src]="customerImageUrl" />
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow-md overflow-hidden w-full md:w-3/4">

                </div>
            </div>

            <!-- <div *ngIf="loading" class="p-4 space-y-4">
                    @for (i of [1,2,3,4]; track i) {
                    <div class="animate-pulse space-y-2">
                        <div class="h-4 bg-gray-300 rounded w-3/4"></div>
                        <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                    </div>
                    }
                </div> -->
        </div>
    </div>
</router-outlet>
