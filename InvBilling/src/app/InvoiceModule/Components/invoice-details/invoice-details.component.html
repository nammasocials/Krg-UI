<router-outlet>
    <div class="max-w-7xl mx-auto px-4 py-4 md:py-8">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 space-y-4 sm:space-y-0">
            <h2 class="text-2xl md:text-3xl font-bold text-white">Invoice-Details : {{InvoiceDetails.invoiceNo}}</h2>
            <button (click)="goBack()"
                class="w-full sm:w-auto bg-green-600 text-white px-4 py-2 md:px-6 md:py-3 rounded-lg hover:bg-green-700 transition duration-200 font-medium text-sm md:text-base">
                Back To Invoices
            </button>
        </div>
        <div class="flex flex-col md:flex-row gap-4">
            <div class="bg-white rounded-lg shadow-md overflow-hidden w-full md:w-1/5 flex items-center justify-center">
                <div *ngIf="customerImageLoading" class="p-4 space-y-4">
                    @for (i of [1,2]; track i) {
                    <div class="animate-pulse space-y-2">
                        <div class="h-4 bg-gray-300 rounded w-3/4"></div>
                        <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                    </div>
                    }
                </div>
                <div *ngIf="!customerImageLoading" class="w-[70%] h-[70%] flex items-center justify-center">
                    <img data-bs-toggle="tooltip" [src]="customerImageUrl" class="w-full h-full object-contain"
                        (error)="customerImageUrl='assets/images/no_image_found.png'" alt="Profile Image" />
                </div>
            </div>
            <div class="rounded-lg shadow-md overflow-hidden w-full md:w-3/5 p-4">
                <div class="bg-white">

                </div>
                <div class="bg-white">
                    
                </div>
            </div>
            <div class="bg-white rounded-lg shadow-md overflow-hidden w-full md:w-1/5 flex items-center justify-center">
                <div *ngIf="EwayBillLoading" class="p-4 space-y-4">
                    @for (i of [1,2]; track i) {
                    <div class="animate-pulse space-y-2">
                        <div class="h-4 bg-gray-300 rounded w-3/4"></div>
                        <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                    </div>
                    }
                </div>
                <div *ngIf="!EwayBillLoading" class="w-[70%] h-[70%] flex items-center justify-center">
                    <img data-bs-toggle="tooltip" [src]="EwayBillImageUrl" class="w-full h-full object-contain"
                        (error)="EwayBillImageUrl='assets/images/no_image_found.png'" alt="Profile Image" />
                </div>
            </div>
        </div>
    </div>

</router-outlet>
