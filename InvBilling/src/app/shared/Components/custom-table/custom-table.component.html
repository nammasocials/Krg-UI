<main class="bg-white rounded-lg shadow-lg overflow-hidden">
    <!-- Table Header with Search -->
    <div class="px-4 sm:px-6 py-4 border-b border-gray-200 bg-gray-50" *ngIf="!isMobileView">
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center space-y-3 sm:space-y-0">
            <h2 class="text-lg font-semibold text-gray-800">{{ title }}</h2>
            <div *ngIf="tableOptions.isSearch || tableOptions.isItemsPerPage" class="flex flex-col sm:flex-row items-stretch sm:items-center space-y-2 sm:space-y-0 sm:space-x-4">
                <label *ngIf="tableOptions.isSearch" for="search" class="sr-only">Search {{ title }}</label>
                <input *ngIf="tableOptions.isSearch" type="text" id="search" placeholder="Search {{ title }}..." [(ngModel)]="searchTerm"
                    [disabled]="data.length <= 0" (input)="updatePagedData()" class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none 
                focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm" />
                <select *ngIf="tableOptions.isItemsPerPage" [disabled]="filteredData.length <= 0" id="rowsPerPage" (change)="onPageSizeChange($event)"
                    [(ngModel)]="pageSize"
                    class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    <option *ngFor="let ip of pageSizeOptions" [value]="ip">{{ ip }} per page</option>
                </select>
            </div>
        </div>
    </div>
    <!----Mobile Part infinite Scrolling has to be done please re-check this---->
    <!-- Mobile Card View -->
    <div id="customersMobileView" class="md:hidden">
        <div class="border-b border-slate-200" *ngIf="filteredData.length > 0">
            <button (click)="toggleMobileOptions()"
                class="w-full flex justify-between items-center py-5 text-slate-800">
                <h2 class="text-lg font-semibold text-gray-800">
                    Options</h2>
            </button>

            <div class="overflow-hidden transition-all duration-300 ease-in-out"
                [ngStyle]="{ 'max-height': isMobileOptionsOpen ? '200px' : '0' }">
                <div class="bg-white border border-gray-200 rounded-lg 
                    p-4 m-4 shadow-sm">

                </div>
            </div>
        </div>

        <div *ngIf="filteredData.length <= 0" class="bg-white border border-gray-200 rounded-lg p-4 m-4 shadow-sm">
            <p>No Record found</p>
        </div>
        <div *ngIf="filteredData.length > 0" class="flex flex-col bg-white shadow rounded-lg overflow-hidden h-[500px]">

            <div class="sticky top-0 bg-gray-100 p-4 border-b flex justify-between items-center z-10">
                <h2 class="font-semibold">{{ title }}</h2>
                <span class="text-sm text-gray-600">{{ mobileData.length }} / {{ filteredData.length }}</span>
            </div>
            <div class="overflow-y-auto p-4 space-y-3" infiniteScroll [infiniteScrollDistance]="3"
                [infiniteScrollThrottle]="200" (scrolled)="onScrollDown()" [scrollWindow]="false">
                <div *ngFor="let item of mobileData" class="bg-white border border-gray-200 rounded-lg 
                    p-4 m-4 shadow-sm">
                    <div class="flex justify-between items-start mb-3">
                        <h3 class="text-lg font-semibold text-gray-900"></h3>
                        <div class="flex flex-wrap gap-2">
                            <button *ngFor="let option of options"
                                class="bg-{{option.theme}}-100 text-{{option.theme}}-700 px-2 py-1 rounded text-sm 
                                hover:bg-{{option.theme}}-200"
                                (click)="emitSelectedActions({type : option.actions, element : item})">{{option.label}}</button>
<!-- 
                            <button class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs hover:bg-blue-200"
                                (click)="ViewData(item)">View</button>
                            <button class="bg-amber-100 text-amber-700 px-2 py-1 rounded text-xs hover:bg-amber-200"
                                (click)="EditData(item)">Edit</button>
                            <button class="bg-red-100 text-red-700 px-2 py-1 rounded text-xs hover:bg-red-200"
                                (click)="DeleteData(item)">Delete</button> -->
                        </div>
                    </div>
                    <div class="grid grid-cols-1 gap-2 text-sm">
                        <div *ngFor="let header of headerData"
                            class="grid grid-cols-[35%_65%] py-1 border-b border-gray-100">
                            <span class="font-medium text-gray-600">{{ header.headerLabel }}</span>
                            <span class="text-gray-900 text-right">{{ item[header.field] }}</span>
                        </div>
                    </div>
                </div>
                <div *ngIf="mobileCurrentIndex >= filteredData.length" class="text-center text-gray-400 py-2">
                    No more records
                </div>
            </div>
        </div>
    </div>

    <!-- Desktop Table View -->
    <div class="hidden md:block">
        <div class="overflow-x-auto">
            <table mat-table [dataSource]="dataSource" matSort class="w-full">

                <ng-container *ngFor="let header of headerData" [matColumnDef]="header.field">
                    <ng-container *ngIf="header?.field !== 'options'">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header
                            class="px-6 py-4 text-left text-sm font-medium text-blue-900 uppercase tracking-wider">
                            {{ header.headerLabel }}
                        </th>
                        <td mat-cell *matCellDef="let element" class="px-6 py-4 text-sm text-gray-700">
                            {{ element[header.field] }}
                        </td>
                    </ng-container>
                    <ng-container *ngIf="header?.field === 'options'">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header
                            class="px-6 py-4 text-left text-sm font-medium text-blue-900 uppercase tracking-wider">
                            Options
                        </th>
                        <td mat-cell *matCellDef="let element"
                            class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-2">
                            <button *ngFor="let option of options"
                                class="bg-{{option.theme}}-100 text-{{option.theme}}-700 px-2 py-1 rounded text-sm hover:bg-{{option.theme}}-200"
                                (click)="emitSelectedActions({type : option.actions, element : element})">{{option.label}}</button>

                            <!-- <button class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-sm hover:bg-blue-200"
                                (click)="ViewData(element)">View</button>
                            <button class="bg-amber-100 text-amber-700 px-2 py-1 rounded text-sm hover:bg-amber-200"
                                (click)="EditData(element)">Edit</button>
                            <button class="bg-red-100 text-red-700 px-2 py-1 rounded text-sm hover:bg-red-200"
                                (click)="DeleteData(element)">Delete</button> -->
                        </td>
                    </ng-container>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-gray-50"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-gray-100"></tr>
            </table>
        </div>
        <!-- Pagination Controls -->
        <div *ngIf="tableOptions.isPagination" class="px-4 sm:px-6 py-4 bg-gray-50 border-t border-gray-200">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between space-y-3 sm:space-y-0">
                <div class="text-sm text-gray-700 text-center sm:text-left">
                    Showing <span id="startRecord">
                        {{startRecord}}
                    </span> to
                    <span id="endRecord">{{endRecord}}</span>
                    of
                    <span id="totalRecords">{{filteredData.length}}</span>
                    result<span *ngIf="filteredData.length > 1">s</span>
                </div>
                <div class="flex items-center justify-center space-x-1 sm:space-x-2">
                    <button id="prevBtn" (click)="prevPage()" [disabled]="paginator?.hasPreviousPage() === false"
                        class="px-2 sm:px-3 py-2 text-xs sm:text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-md hover:bg-gray-50 hover:text-gray-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                        <span class="hidden sm:inline">Previous</span>
                        <span class="sm:hidden">Prev</span>
                    </button>

                    <div id="pageNumbers" class="flex space-x-1">
                        <!-- Page numbers will be populated by JavaScript -->
                    </div>

                    <button id="nextBtn" (click)="nextPage()" [disabled]="paginator?.hasNextPage() === false"
                        class="px-2 sm:px-3 py-2 text-xs sm:text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-md hover:bg-gray-50 hover:text-gray-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                        Next
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>
