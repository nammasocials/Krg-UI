<main class="bg-white rounded-lg shadow-lg overflow-hidden">
    <!-- Table Header with Search -->
    <div class="px-4 sm:px-6 py-4 border-b border-gray-200 bg-gray-50">
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center space-y-3 sm:space-y-0">
            <h2 class="text-lg font-semibold text-gray-800">{{ title }}</h2>
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center space-y-2 sm:space-y-0 sm:space-x-4">
                <label for="search" class="sr-only">Search {{ title }}</label>
                <input type="text" id="search" placeholder="Search {{ title }}..." [(ngModel)]="searchTerm" [disabled]="data.length <= 0" 
                (input)="updatePagedData()" class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none 
                focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm" />
                <select [disabled]="filteredData.length <= 0" id="rowsPerPage" (change)="onPageSizeChange($event)"
                    [(ngModel)]="pageSize"
                    class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    <option *ngFor="let ip of pageSizeOptions" [value]="ip">{{ ip }} per page</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Mobile Card View -->
    <div id="customersMobileView" class="md:hidden"></div>

    <!-- Desktop Table View -->
    <div class="hidden md:block overflow-x-auto">
        <table mat-table [dataSource]="dataSource" class="w-full">
            <ng-container *ngFor="let header of headerData" [matColumnDef]="header.field">
                <th mat-header-cell *matHeaderCellDef
                    class="px-6 py-4 text-left text-sm font-medium text-blue-900 uppercase tracking-wider">
                    {{ header.headerLabel }}
                </th>
                <td mat-cell *matCellDef="let element" class="px-6 py-4 text-sm text-gray-700">
                    {{ element[header.field] }}
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-gray-50"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-gray-100"></tr>
        </table>
    </div>
    <!-- Pagination Controls -->
    <div class="px-4 sm:px-6 py-4 bg-gray-50 border-t border-gray-200">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between space-y-3 sm:space-y-0">
            <div class="text-sm text-gray-700 text-center sm:text-left">
                Showing <span id="startRecord">
                    {{startRecord}}
                </span> to
                <span id="endRecord">{{endRecord}}</span>
                of
                <span id="totalRecords">{{filteredData.length}}</span>
                result<span *ngIf="filteredData.length > 1">s</span>
            </div>
            <div class="flex items-center justify-center space-x-1 sm:space-x-2">
                <button id="prevBtn" (click)="prevPage()" [disabled]="paginator?.hasPreviousPage() === false"
                    class="px-2 sm:px-3 py-2 text-xs sm:text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-md hover:bg-gray-50 hover:text-gray-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                    <span class="hidden sm:inline">Previous</span>
                    <span class="sm:hidden">Prev</span>
                </button>

                <div id="pageNumbers" class="flex space-x-1">
                    <!-- Page numbers will be populated by JavaScript -->
                </div>

                <button id="nextBtn" (click)="nextPage()" [disabled]="paginator?.hasNextPage() === false"
                    class="px-2 sm:px-3 py-2 text-xs sm:text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-md hover:bg-gray-50 hover:text-gray-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                    Next
                </button>
            </div>
        </div>
    </div>
</main>
