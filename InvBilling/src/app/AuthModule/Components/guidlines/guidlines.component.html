<ul *ngIf="!isPassword">
    <li>
        Username Should not start with numbers or Symbols
    </li>
    <li>
        Username Should have minimum of 5 and maximum of 20 characters
    </li>
    <li>
        Username Should not have any special characters
    </li>
</ul>
<ul *ngIf="isPassword">
<li> Password should be 7-20 characters with 2 special characters, numbers, lowercase, and uppercase letters</li>
</ul>
