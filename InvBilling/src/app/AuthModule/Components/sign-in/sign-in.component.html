<div id="loginPage" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-purple-700">
    <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-md fade-in">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Invoice Manager</h1>
            <p class="text-gray-600">Sign in to your account</p>
        </div>
        <form [formGroup]="form" (ngSubmit)="SignIn()">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                <input formControlName="username" type="text" id="username" name="username" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200">
                <div *ngIf="username?.touched && username?.invalid" class="error-messages">
                    Invalid username. Please click here for <span class="guidelines"
                        (click)="openChildPopup(false)">guidelines</span>.
                </div>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input formControlName="password" type="password" id="password" name="password" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200">
                <div *ngIf="password?.touched && password?.invalid" class="error-messages">
                    Invalid Password. Please click here for <span class="guidelines"
                        (click)="openChildPopup(true)">guidelines</span>.
                </div>
            </div>
            <br>
            <button type="submit" [disabled]="form.invalid"
                class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200 font-medium">
                Sign In
            </button>
            <button type="button" [disabled]="form.invalid" (click)="testSigin()"
                class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200 font-medium">
                Test Sign In
            </button>
        </form>
    </div>
    <!-- <app-popup *ngIf="showPopup" [title]="popupTitle" [message]="popupMessage" [footerType]="popupFooterType"
     [width]="popupWidth" [childComponent]="popupChild" [childData]="popupChildData" (closed)="handlePopupClose($event)">
    </app-popup> -->
</div>
