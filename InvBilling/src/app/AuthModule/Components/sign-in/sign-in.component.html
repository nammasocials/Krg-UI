<div id="loginPage"
    class=" p-[10%] min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-purple-700">
    <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-md fade-in">
        <div class="text-center mb-8">
            <img [src]="Constant.LogoSrc" alt="App Logo" class="mx-auto mb-4 w-16 h-16 rounded-full" />
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Invoice Manager</h1>
            <p class="text-gray-600">Sign in to your account</p>
        </div>
        <form [formGroup]="form" (ngSubmit)="SignIn()">
            <div>
                <label for="username" class="block label font-medium text-gray-700 mb-2">Username</label>
                <input formControlName="username" type="text" id="username" name="username" required [ngClass]="{
                    'border-red-500 focus:ring-red-500': username?.invalid && (username?.dirty || username?.touched),
                    'border-gray-300 focus:ring-blue-500': !(username?.invalid && (username?.dirty || username?.touched))
                }"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200">
                <div *ngIf="username?.touched && username?.invalid" class="error-messages">
                    Username must start with a letter, be 5-20 characters long, and contain only letters or numbers..
                </div>
            </div>
            <br>
            <div class="relative w-full">

                <!-- Input + icon wrapper -->
                <div class="relative">
                    <input formControlName="password" [type]="hide ? 'password' : 'text'" id="password" name="password"
                        required [ngClass]="{
        'border-red-500 focus:ring-red-500': password?.invalid && (password?.dirty || password?.touched),
        'border-gray-300 focus:ring-blue-500': !(password?.invalid && (password?.dirty || password?.touched))
      }" class="w-full px-4 py-3 pr-12 border rounded-lg focus:ring-2 focus:border-transparent transition duration-200"
                        placeholder="Enter your password" />

                    <!-- Eye icon button (aligned properly) -->
                    <button type="button" (click)="toggle()"
                        class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700">
                        <ng-container *ngIf="hide; else eyeOff">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </ng-container>

                        <ng-template #eyeOff>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.956 9.956 0 012.411-3.662M6.18 6.18A9.956 9.956 0 0112 5c4.477 0 8.268 2.943 9.542 7a9.986 9.986 0 01-4.997 5.882M3 3l18 18" />
                            </svg>
                        </ng-template>
                    </button>
                </div>

                <!-- Validation error -->
                <div *ngIf="password?.touched && password?.invalid" class="text-red-500 text-sm mt-1">
                    Password should be 7–20 characters with 2 special characters, numbers, lowercase, and uppercase
                    letters.
                </div>

            </div>


            <br>
            <button type="submit" [disabled]="form.invalid"
                class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200 font-medium">
                Sign In
            </button>
        </form>
    </div>
    <!-- <app-popup *ngIf="showPopup" [title]="popupTitle" [message]="popupMessage" [footerType]="popupFooterType"
     [width]="popupWidth" [childComponent]="popupChild" [childData]="popupChildData" (closed)="handlePopupClose($event)">
    </app-popup> -->
</div>
