<div *ngIf="RecentActLoading" class="p-4 space-y-4">
    @for (i of [1,2,3,4]; track i) {
    <div class="animate-pulse space-y-2">
        <div class="h-4 bg-gray-300 rounded w-3/4"></div>
        <div class="h-4 bg-gray-200 rounded w-1/2"></div>
    </div>
    }
</div>
<app-custom-table *ngIf="!RecentActLoading" [data]="activityLogs" [headerData]="activityheaderData"
    [options]="recentActivityOptions"
    [tableOptions]="tableOptions" [title]="activityTitle" (OptionsClicked)="ActivityActions($event)">
</app-custom-table>
