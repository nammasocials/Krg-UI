<router-outlet>
    <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
        <!-- Stats Cards -->
        <div class="bg-white rounded-xl p-6 shadow-lg card-hover">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center">
                    <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z">
                            </path>
                        </svg>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm font-medium text-gray-600">Customers</p>
                    </div>
                </div>
                <div class="text-right">
                    <button
                        class="px-3 py-1 text-xs bg-blue-100 text-blue-700 rounded-full hover:bg-blue-200 transition-colors">
                        View Details
                    </button>
                </div>
            </div>
            <div class="mb-4">
                <h3 class="text-2xl font-bold text-gray-900">{{customerDetails.overallCount}}</h3>
                <p class="text-sm text-blue-600 flex items-center mt-1">
            </div>
            <div class="space-y-2">
                <div class="flex justify-between text-sm">
                    <span class="text-gray-600">New Customers (Current month)</span>
                    <span class="font-medium">{{customerDetails.recentAddedCount}}</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2">
                    <div class="bg-blue-500 h-2 rounded-full" [style.width.%]="customerPercentage"></div>
                </div>
            </div>
        </div>
        <div class="bg-white rounded-xl p-6 shadow-lg card-hover">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center">
                    <div class="w-12 h-12 bg-orange-100 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                        </svg>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm font-medium text-gray-600">Products</p>
                    </div>
                </div>
                <div class="text-right">
                    <button
                        class="px-3 py-1 text-xs bg-orange-100 text-orange-700 rounded-full hover:bg-orange-200 transition-colors">
                        View Details
                    </button>
                </div>
            </div>
            <div class="mb-4">
                <h3 class="text-2xl font-bold text-gray-900">30</h3>
                <p class="text-sm text-orange-600 flex items-center mt-1">
            </div>
            <div class="space-y-2">
                <div class="flex justify-between text-sm">
                    <span class="text-gray-600">New Products (Current month)</span>
                    <span class="font-medium">10</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2">
                    <div class="bg-orange-600 h-2 rounded-full" style="width: 25%"></div>
                </div>
            </div>
        </div>
        <div class="bg-white rounded-xl p-6 shadow-lg card-hover">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center">
                    <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-purple-600" fill="currentColor" viewBox="0 0 20 20">
                            <path
                                d="M6 2a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V7.828a2 2 0 00-.586-1.414l-4.828-4.828A2 2 0 0010.172 1H6zm4 1.414L15.586 7H11a1 1 0 01-1-1V3.414zM7 10h6v1H7v-1zm0 3h6v1H7v-1z" />
                        </svg>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm font-medium text-gray-600">Invoice</p>
                    </div>
                </div>
                <div class="text-right">
                    <button
                        class="px-3 py-1 text-xs bg-purple-100 text-purple-700 rounded-full hover:bg-purple-200 transition-colors">
                        View Details
                    </button>
                </div>
            </div>
            <div class="mb-4">
                <div class="flex items-baseline">
                    <h3 class="text-2xl font-bold text-gray-900">94</h3>
                </div>
            </div>
            <div class="space-y-2">
                <div class="flex justify-between text-sm">
                    <span class="text-gray-600">New Products (Current month)</span>
                    <span class="font-medium">10</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2">
                    <div class="bg-purple-600 h-2 rounded-full" style="width: 25%"></div>
                </div>
            </div>
        </div>
        <div class="bg-white rounded-xl p-6 shadow-lg card-hover">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center">
                    <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                        <svg class="w-7 h-7 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1">
                            </path>
                        </svg>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm font-medium text-gray-600">Total Revenue</p>
                        <div class="flex items-center">
                            <span class="pulse-dot w-2 h-2 bg-green-500 rounded-full mr-2"></span>
                            <span class="text-xs text-green-600 font-medium">Live</span>
                        </div>
                    </div>
                </div>
                <button class="text-gray-400 hover:text-gray-600 transition-colors">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path
                            d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z">
                        </path>
                    </svg>
                </button>
            </div>
            <div class="mb-4">
                <h3 class="text-2xl font-bold text-gray-900" id="revenue-amount">$24,567</h3>
            </div>
            <div class="space-y-2">
                <div class="flex justify-between text-sm">
                    <span class="text-gray-600">For Current Month</span>
                    <span class="font-medium">10</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2">
                    <div class="bg-green-600 h-2 rounded-full" style="width: 25%"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="bg-white rounded-xl p-6 shadow-lg card-hover">
        <div *ngIf="RecentActLoading" class="p-4 space-y-4">
            @for (i of [1,2,3,4]; track i) {
            <div class="animate-pulse space-y-2">
                <div class="h-4 bg-gray-300 rounded w-3/4"></div>
                <div class="h-4 bg-gray-200 rounded w-1/2"></div>
            </div>
            }
        </div>
        <app-custom-table *ngIf="!RecentActLoading" 
        [data]="activityLogs" [headerData]="activityheaderData" [options]="recentActivityOptions" [title]="activityTitle"
            (OptionsClicked)="ActivityActions($event)">
        </app-custom-table>
    </div>
</router-outlet>
